# cargo-deny configuration (M0 §6.2, ADR 022).
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Transitive "unmaintained" notices (paste, rustybuzz, ttf-parser, zvariant via gpui, image, ashpd)
# are informational; only direct dependencies of workspace crates fail. Vulnerabilities always fail.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "0BSD", "Zlib",
    # IJG: jpeg-encoder (FSF free, GPL-compatible; attribution in About). Decided in M1.
    "IJG", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "Unlicense", "BSL-1.0",
    "GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later",
    "LGPL-2.1", "LGPL-2.1-or-later", "LGPL-3.0", "LGPL-3.0-or-later",
    "AGPL-3.0", "AGPL-3.0-only", "AGPL-3.0-or-later",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    # OpenSSL stays banned. cargo-deny unifies features across both targets, so it sees
    # native-tls's OpenSSL backend although Windows builds use SChannel and Linux builds don't
    # enable native-tls at all (ADR 025; `cargo tree --target <t> -i openssl` is empty for both).
    { name = "openssl", wrappers = ["native-tls"] },
    { name = "openssl-sys", wrappers = ["openssl", "native-tls"] },
    # Tokio only through laqta-http (ADR 007): the wrappers are laqta-http and the HTTP/SSH stack it alone brings in.
    { name = "tokio", wrappers = ["laqta-http", "reqwest", "hyper", "hyper-util", "hyper-rustls", "h2", "tokio-rustls", "tokio-util", "tower", "russh", "russh-sftp"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
