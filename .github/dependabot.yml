version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose; they are upgraded together by hand (ADR 002, ADR 023, ADR 024).
      - dependency-name: gpui-pre
      - dependency-name: gpui-pre-platform
      - dependency-name: gpui-component
      - dependency-name: gpui-fps
      - dependency-name: ort
      - dependency-name: cosmic-text
