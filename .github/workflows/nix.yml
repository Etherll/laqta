name: Nix

# Builds the flake package with the Cachix cache named by the CACHIX_CACHE repository variable.
# Builds of main and of release tags are also pushed there (with the CACHIX_AUTH_TOKEN secret),
# so Nix users download them instead of compiling; pull request builds only read from it.
#
# A pull request builds `checks.<system>.release`: the package with the quicker `release` profile
# instead of the downloads' fat-LTO `dist`. Its compiled dependencies (crane's `cargoArtifacts`)
# are pushed from main, so a pull request that leaves Cargo.lock alone compiles only Laqta's crates.
# The main CI workflow already compiles every code change; this one runs on pull requests only for
# changes to how the package is built.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - Cargo.toml
      - Cargo.lock
      - vendor/**
      - packaging/linux/**
      - assets/icon/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build (x86_64-linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # Fetching the flake inputs through GitHub's API without a token hits its rate limit.
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          # Without the token (forks, pull requests from forks) the cache is only read.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Pushed below: only the package's runtime closure, not the crate sources and other
          # build-only paths the job also creates.
          skipPush: true
      - run: nix flake check --no-build
      - name: Build
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            nix build .#checks.x86_64-linux.release --print-build-logs
          else
            nix build .#laqta --print-build-logs
            # The compiled dependencies are not installed anywhere; they are pushed so the next
            # build of main (dist) and pull requests (release) start from them.
            nix build .#laqta.cargoArtifacts --out-link deps-dist
            nix build .#checks.x86_64-linux.release.cargoArtifacts --print-build-logs --out-link deps-release
          fi
      - run: ./result/bin/laqta --version
      - name: Push to Cachix
        if: env.CACHIX_PUSH == 'true'
        # Paths already on cache.nixos.org are skipped, so this is Laqta, the FFmpeg it builds and
        # the compiled dependencies of both profiles.
        run: cachix push "${{ vars.CACHIX_CACHE }}" ./result ./deps-dist ./deps-release
    env:
      CACHIX_PUSH: ${{ github.event_name != 'pull_request' && vars.CACHIX_CACHE != '' && secrets.CACHIX_AUTH_TOKEN != '' }}
