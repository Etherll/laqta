name: Release

# Pushing a version tag (v0.1.0, v0.2.0-beta.1, …) builds Laqta for Linux, Windows and macOS and attaches
# the packages to a draft GitHub release. Review the draft, then publish it.
#
# Asset names carry no version, so the README can link to releases/latest/download/<name>:
#   laqta-windows-x64-setup.exe, laqta-windows-x64-portable.exe, laqta-linux-x86_64.AppImage,
#   laqta-linux-x86_64.tar.zst, laqta-linux-amd64.deb, laqta-macos-universal.dmg (each with a .sha256)
# The Velopack update package (Laqta-<version>-…-full.nupkg and its feed files) and SHA256SUMS are
# what the in-app updater reads on Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The CI checks run first; a failure stops the build and the release.
  checks:
    uses: ./.github/workflows/ci.yml

  linux:
    name: Build (Linux x86_64)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        # Only main saves: per-PR caches overflowed the 10 GB limit and evicted main's.
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev
          libfontconfig-dev libfreetype-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config
          libegl-dev libgbm-dev libdrm-dev
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deb@3.8.0" }
      - name: Check the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "laqta") | .version')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - run: cargo build --release --locked -p laqta -p laqta-nmh
      - name: Package
        run: |
          mkdir -p dist
          dir="laqta-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/$dir"
          cp target/release/laqta target/release/laqta-nmh LICENSE README.md "dist/$dir/"
          sed 's|^Exec=/usr/bin/laqta|Exec=laqta|' packaging/linux/io.github.etherll.Laqta.desktop > "dist/$dir/io.github.etherll.Laqta.desktop"
          cp -r assets/icon "dist/$dir/icons"
          # zstd -19: about a quarter smaller than gzip -9, and faster to unpack.
          tar -C dist -cf - "$dir" | zstd -19 -T0 -q -o dist/laqta-linux-x86_64.tar.zst
          rm -rf "dist/$dir"
          # The .deb takes its version from Cargo.toml and its dependencies from dpkg-shlibdeps.
          cargo deb -p laqta --no-build -o dist/laqta-linux-amd64.deb
      - name: AppImage
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -sSLf -o appimagetool "$APPIMAGETOOL_URL"
          curl -sSLf -o runtime-x86_64 "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c
          echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum -c
          chmod +x appimagetool
          app=Laqta.AppDir id=io.github.etherll.Laqta
          mkdir -p $app/usr/bin $app/usr/share/applications
          cp target/release/laqta target/release/laqta-nmh $app/usr/bin/
          sed 's|^Exec=/usr/bin/laqta|Exec=laqta|' packaging/linux/$id.desktop > $app/usr/share/applications/$id.desktop
          cp $app/usr/share/applications/$id.desktop $app/
          for size in 16 32 64 128 256 512; do
            mkdir -p $app/usr/share/icons/hicolor/${size}x${size}/apps
            cp assets/icon/laqta-$size.png $app/usr/share/icons/hicolor/${size}x${size}/apps/$id.png
          done
          mkdir -p $app/usr/share/icons/hicolor/scalable/apps
          cp assets/icon/laqta.svg $app/usr/share/icons/hicolor/scalable/apps/$id.svg
          cp assets/icon/laqta-256.png $app/$id.png
          ln -s usr/bin/laqta $app/AppRun
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --runtime-file runtime-x86_64 -n "$PWD/$app" "$PWD/dist/laqta-linux-x86_64.AppImage"
          ./dist/laqta-linux-x86_64.AppImage --appimage-extract-and-run --version
      - name: Checksums
        run: cd dist && for f in *.tar.zst *.deb *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: Build (Windows x64)
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VCPKGRS_TRIPLET: x64-windows-static-md
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        # Only main saves: per-PR caches overflowed the 10 GB limit and evicted main's.
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: vcpkg install "sqlite3[fts5]:x64-windows-static-md"
      - run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - run: cargo build --release --locked -p laqta -p laqta-nmh
      - name: Install Velopack
        run: dotnet tool install vpk --version 1.2.161 --tool-path .vpk
      - name: Package
        shell: pwsh
        run: |
          # The version comes from Cargo.toml, so a manual run from a branch packs too.
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq laqta).version
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/laqta.exe, target/release/laqta-nmh.exe, LICENSE, README.md stage/
          # The installer and the update package. Laqta answers the --veloapp-* hooks itself and
          # does not link the Velopack SDK, so the SDK check is skipped.
          .vpk/vpk pack --packId Laqta --packVersion $version --packTitle Laqta --packAuthors "Laqta contributors" `
            --packDir stage --mainExe laqta.exe --icon assets/icon/laqta.ico `
            --shortcuts Desktop,StartMenuRoot --skipVeloAppCheck --outputDir velopack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem velopack
          Get-ChildItem velopack -Filter *Setup.exe | Move-Item -Destination dist/laqta-windows-x64-setup.exe
          Get-ChildItem velopack -File | Where-Object { $_.Name -notlike '*Portable.zip' } | Move-Item -Destination dist
          # The portable build is laqta.exe under a name containing "portable", which keeps its
          # settings and history in LaqtaData next to it.
          Copy-Item target/release/laqta.exe dist/laqta-windows-x64-portable.exe
          foreach ($f in "laqta-windows-x64-setup.exe", "laqta-windows-x64-portable.exe") {
            $hash = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii "dist/$f.sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # One universal app for Apple silicon and Intel (ADR 030). With the signing secrets set the app
  # is signed with a Developer ID and notarized; without them it is ad-hoc signed, and macOS asks
  # the user to allow it in System Settings on first open.
  macos:
    name: Build (macOS universal)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        # Only main saves: per-PR caches overflowed the 10 GB limit and evicted main's.
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p laqta -p laqta-nmh --target $target
          done
          mkdir -p universal dist
          for bin in laqta laqta-nmh; do
            lipo -create -output universal/$bin target/aarch64-apple-darwin/release/$bin target/x86_64-apple-darwin/release/$bin
          done
      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          rm cert.p12
      - name: Bundle and sign
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version=0.0.0 ;; esac
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then unset MACOS_SIGN_IDENTITY; fi
          scripts/macos-bundle.sh universal/laqta universal/laqta-nmh "$version" build
          build/Laqta.app/Contents/MacOS/laqta --version
      - name: Disk image
        run: |
          mkdir dmg && cp -R build/Laqta.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Laqta -srcfolder dmg -ov -format UDZO dist/laqta-macos-universal.dmg
      - name: Notarize
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: |
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" dist/laqta-macos-universal.dmg
          xcrun notarytool submit dist/laqta-macos-universal.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/laqta-macos-universal.dmg
          spctl --assess --type open --context context:primary-signature -v dist/laqta-macos-universal.dmg
      - name: Checksum
        run: cd dist && shasum -a 256 laqta-macos-universal.dmg > laqta-macos-universal.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    name: Draft the GitHub release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: SHA256SUMS
        # The in-app updater checks the Windows update package against this list.
        run: cd dist && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
