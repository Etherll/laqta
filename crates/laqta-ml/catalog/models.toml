languages = ["zh", "en", "ja"]
dict_url = "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf/ppocr/utils/dict/ppocrv5_dict.txt"
dict_sha256 = "d1979e9f794c464c0d2e0b70a7fe14dd978e9dc644c0e71f14158cdf8342af1b"
dict_size_bytes = 74012

[[model]]
id = "ppocr-v5-mobile-rec-latin"
task = "ocr-rec"
