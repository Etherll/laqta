# Background removal (ADR 023). BiRefNet and BEN2 take 1024 px inputs, U²-Net-p 320 px.
# BiRefNet exports several outputs and the last one is the finest, so it reads output -1.

[[model]]
id = "birefnet-lite"
task = "background"
family = "matting-parametric"
default = false
name = "BiRefNet lite, fp32"
description = "Separates the main subject from its background. Full-precision weights: about twice the download of the fp16 model, for edges that can differ slightly."
url = "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/de15b22ba131738a16dff04aab8bdf8dc32e3ac1/onnx/model.onnx"
sha256 = "5600024376f572a557870a5eb0afb1e5961636bef4e1e22132025467d0f03333"
size_bytes = 224005088
licence = "MIT"
commercial = true
precisions = ["fp32"]

[model.matting]
input_size = 1024
mean = [0.485, 0.456, 0.406]
std = [0.229, 0.224, 0.225]
output_index = -1
activation = "sigmoid"

