# The model catalog (ADR 023). Shipped with each release; downloads are verified against the
# pinned SHA-256 with laqta-http's verified fetch.
#
# Each [[model]] entry:
#   id, task ("ocr-det" | "ocr-rec" | "background" | "inpaint"), family (a name from families/mod.rs),
#   name, description, url, sha256 (64 lowercase hex, or "pending-owner"), size_bytes,
#   licence, commercial, precisions, languages (rec: BCP-47 tags or script names).
#   Rec entries also carry dict_url, dict_sha256 and dict_size_bytes: the character
#   dictionary, one entry per line, without the CTC blank (the loader adds it).
#   The matting-parametric family takes a [model.matting] table right after its entry:
#   input_size, mean, std, output_index (negative counts from the end; -1 is the last output),
#   and activation ("sigmoid" | "minmax" | "none"). No other family takes that table.
#   default = true marks the one entry per task that is used when none is chosen.
#
# sha256 = "pending-owner" refuses the download with a named error, so an unverified file never
# lands on disk. Every hash below was checked against the file it names.
#
# Hugging Face URLs are pinned to a commit. The dictionaries come from PaddleOCR at a pinned commit.

[[model]]
id = "ppocr-v5-mobile-det"
task = "ocr-det"
family = "o1-det"
default = true
name = "PP-OCRv5 mobile text detection"
description = "Finds text lines in an image (DBNet). Works for any script."
url = "https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/e6f4fa85f00e168c862bc462aebca69eef9b3d3d/inference.onnx"
sha256 = "a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d"
size_bytes = 4826518
licence = "Apache-2.0"
commercial = true
precisions = ["fp32"]
languages = []

[[model]]
id = "ppocr-v5-mobile-rec-multi"
task = "ocr-rec"
family = "o1-rec"
default = true
name = "PP-OCRv5 mobile recognition, Chinese, English, Japanese"
description = "Reads text lines in Simplified and Traditional Chinese, English and Japanese."
url = "https://huggingface.co/PaddlePaddle/PP-OCRv5_mobile_rec_onnx/resolve/ed152b8b495f84de93cda5709d768548a9127622/inference.onnx"
sha256 = "da72dc72ca4dc220df0dfde68c1dedc31c58d3e76a25871122e5056227d50092"
size_bytes = 16534782
licence = "Apache-2.0"
commercial = true
