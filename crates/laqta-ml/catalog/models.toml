# Inpainting (ADR 023). The photo editor's inpainting tool runs this model on a crop around
# the masked area and pastes back only the masked pixels.

[[model]]
id = "big-lama"
task = "inpaint"
family = "lama"
default = true
name = "Big-LaMa inpainting, 512 px"
description = "Fills the masked area with plausible content. Works on a 512 px crop around the mask, so large masks lose detail."
url = "https://huggingface.co/Carve/LaMa-ONNX/resolve/c3c0c9e468934d62e79c329e35d82dd09ff8c444/lama_fp32.onnx"
sha256 = "1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6"
size_bytes = 208044816
licence = "Apache-2.0"
commercial = true
precisions = ["fp32"]

