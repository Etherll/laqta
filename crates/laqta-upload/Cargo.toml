[package]
name = "laqta-upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["host-imgur", "host-dropbox", "host-google-drive", "host-onedrive", "host-s3", "host-ftp", "host-sftp", "host-shared-folder", "host-bitly"]
host-imgur = []
host-dropbox = []
host-google-drive = []
host-onedrive = []
host-s3 = ["dep:rusty-s3"]
host-ftp = ["dep:suppaftp"]
host-sftp = []
host-shared-folder = []
host-bitly = []

[dependencies]
laqta-domain.workspace = true
laqta-ports.workspace = true
laqta-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path.workspace = true
roxmltree.workspace = true
fancy-regex.workspace = true
base64.workspace = true
url.workspace = true
percent-encoding.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff.workspace = true
futures-lite.workspace = true
rusty-s3 = { workspace = true, optional = true }
suppaftp = { workspace = true, optional = true }

[dev-dependencies]
laqta-ports = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
