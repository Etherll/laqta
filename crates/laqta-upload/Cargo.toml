[package]
name = "laqta-upload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["host-imgur", "host-dropbox", "host-google-drive", "host-onedrive", "host-s3", "host-ftp", "host-sftp", "host-shared-folder", "host-bitly"]
host-imgur = []
host-dropbox = []
host-google-drive = []
host-onedrive = []
host-s3 = ["dep:rusty-s3"]
host-ftp = ["dep:suppaftp", "dep:rustls", "dep:rustls-platform-verifier", "dep:native-tls"]
host-sftp = ["dep:russh", "dep:russh-sftp"]
host-shared-folder = []
host-bitly = []

[dependencies]
laqta-domain.workspace = true
laqta-ports.workspace = true
laqta-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path.workspace = true
roxmltree.workspace = true
fancy-regex.workspace = true
base64.workspace = true
url.workspace = true
percent-encoding.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
jiff.workspace = true
futures-lite.workspace = true
rusty-s3 = { workspace = true, optional = true }
aes-gcm.workspace = true
pbkdf2.workspace = true
bs58.workspace = true
hmac.workspace = true
sha1.workspace = true
md-5.workspace = true
flate2.workspace = true

[target.'cfg(not(windows))'.dependencies]
suppaftp = { workspace = true, optional = true, features = ["rustls-aws-lc-rs"] }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
lettre = { workspace = true, features = ["rustls", "aws-lc-rs", "rustls-platform-verifier"] }

[target.'cfg(windows)'.dependencies]
suppaftp = { workspace = true, optional = true, features = ["native-tls"] }
native-tls = { workspace = true, optional = true }
lettre = { workspace = true, features = ["native-tls"] }

[dev-dependencies]
laqta-ports = { workspace = true, features = ["fakes"] }
tempfile.workspace = true
