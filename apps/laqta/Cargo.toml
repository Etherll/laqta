[package]
name = "laqta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Screen capture, recording, annotation and upload for Windows and Linux"

[lints]
workspace = true

[[bin]]
name = "laqta"
path = "src/main.rs"

[features]
default = []

[dependencies]
async-broadcast.workspace = true
laqta-cloud.workspace = true
laqta-domain.workspace = true
laqta-ports.workspace = true
laqta-app.workspace = true
laqta-imaging.workspace = true
laqta-ipc.workspace = true
laqta-ui.workspace = true
laqta-import.workspace = true
laqta-library.workspace = true
laqta-update.workspace = true
laqta-upload.workspace = true
laqta-media.workspace = true
laqta-editor.workspace = true
laqta-ml.workspace = true
cosmic-text.workspace = true
laqta-http.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
jiff = { version = "0.2.39" }
rayon.workspace = true
async-executor.workspace = true
async-io.workspace = true
blocking.workspace = true
futures-lite.workspace = true
futures-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dirs.workspace = true
fastrand.workspace = true
getrandom.workspace = true

[dev-dependencies]
laqta-ports = { workspace = true, features = ["fakes"] }

[build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(target_os = "linux")'.dependencies]
laqta-platform-linux.workspace = true
# `malloc_trim` after the models are released (`models::ModelReleaser`).
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
laqta-platform-macos.workspace = true
# The native view of a GPUI window, for `laqta_platform_macos::cover_screen`.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
laqta-platform-windows.workspace = true
# The native handle of a GPUI window, for `laqta_platform_windows::plain_popup`.
raw-window-handle = "0.6"

# `cargo deb -p laqta` (release workflow) builds the Debian package.
[package.metadata.deb]
name = "laqta"
maintainer = "Etherll <61019402+Etherll@users.noreply.github.com>"
copyright = "Etherll and Laqta contributors"
license-file = ["../../LICENSE", "0"]
section = "graphics"
priority = "optional"
depends = "$auto"
extended-description = """\
Laqta takes screenshots and screen recordings, lets you mark them up, and uploads them \
wherever you want, starting from one shortcut. It imports ShareX settings, uploaders, \
effects, backups and history."""
assets = [
    ["target/release/laqta", "usr/bin/", "755"],
    ["target/release/laqta-nmh", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.etherll.Laqta.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon/laqta-16.png", "usr/share/icons/hicolor/16x16/apps/io.github.etherll.Laqta.png", "644"],
    ["../../assets/icon/laqta-32.png", "usr/share/icons/hicolor/32x32/apps/io.github.etherll.Laqta.png", "644"],
    ["../../assets/icon/laqta-64.png", "usr/share/icons/hicolor/64x64/apps/io.github.etherll.Laqta.png", "644"],
    ["../../assets/icon/laqta-128.png", "usr/share/icons/hicolor/128x128/apps/io.github.etherll.Laqta.png", "644"],
    ["../../assets/icon/laqta-256.png", "usr/share/icons/hicolor/256x256/apps/io.github.etherll.Laqta.png", "644"],
    ["../../assets/icon/laqta-512.png", "usr/share/icons/hicolor/512x512/apps/io.github.etherll.Laqta.png", "644"],
    ["../../assets/icon/laqta.svg", "usr/share/icons/hicolor/scalable/apps/io.github.etherll.Laqta.svg", "644"],
    ["../../README.md", "usr/share/doc/laqta/README.md", "644"],
]
