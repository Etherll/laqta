[package]
name = "laqta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "laqta"
path = "src/main.rs"

[features]
default = []

[dependencies]
laqta-domain.workspace = true
laqta-ports.workspace = true
laqta-app.workspace = true
laqta-imaging.workspace = true
laqta-ipc.workspace = true
laqta-ui.workspace = true
laqta-library.workspace = true
laqta-upload.workspace = true
laqta-http.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
jiff = { version = "0.2.39" }
rayon.workspace = true
async-executor.workspace = true
async-io.workspace = true
blocking.workspace = true
futures-lite.workspace = true
futures-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dirs.workspace = true
fastrand.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
laqta-platform-linux.workspace = true

[target.'cfg(windows)'.dependencies]
laqta-platform-windows.workspace = true
