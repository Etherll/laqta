[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# workspace crates
laqta-domain = { path = "crates/laqta-domain" }
laqta-imaging = { path = "crates/laqta-imaging" }
laqta-ports = { path = "crates/laqta-ports" }
laqta-app = { path = "crates/laqta-app" }
laqta-ipc = { path = "crates/laqta-ipc" }
laqta-ui = { path = "crates/laqta-ui" }
laqta-platform-linux = { path = "crates/laqta-platform-linux" }
laqta-platform-windows = { path = "crates/laqta-platform-windows" }
laqta-library = { path = "crates/laqta-library" }
laqta-http = { path = "crates/laqta-http" }
laqta-upload = { path = "crates/laqta-upload" }
laqta-editor = { path = "crates/laqta-editor" }

# UI (ADR 002: move together)
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui-component = { version = "=0.9.0" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

# core
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
bitflags = { version = "2", features = ["serde"] }
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
png = "0.18.1"
rayon = "1.12"
jpeg-encoder = "0.7.1"
zune-jpeg = "0.5.15"
image-webp = "0.2.4"
gif = "0.14.2"
tiff = "0.11.3"
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
image = { version = "0.25", default-features = false }
smallvec = "1"
qrcode = { version = "0.14.1", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rusqlite = "0.41.1"  # bundled on Linux, vcpkg SQLite on Windows (ADR 026)
fastrand = "2.5.0"
swayipc = "4.0.0"
atspi = "0.30.0"
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }

# application
async-broadcast = "0.7.2"
futures-channel = "0.3.34"
futures-lite = "2.6.1"
async-executor = "1.14.1"
async-io = "2.6.0"
blocking = "1.7.0"
interprocess = "2.4.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dirs = "7.0.0"

# platforms
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
windows = "0.62.2"
x11rb = { version = "0.14.0", features = ["shm", "randr", "xfixes", "allow-unsafe-code"] }
libwayshot = "0.9.0"
ashpd = { version = "0.14.0", default-features = false, features = ["async-io", "screenshot", "global_shortcuts"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }

# network (Tokio only inside laqta-http, ADR 007)
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "io-util", "sync", "fs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "stream", "multipart"] }  # TLS feature per target (ADR 025)
sha2 = "0.11.1"
oauth2 = { version = "5.0.0", default-features = false }
rusty-s3 = "0.11.0"
suppaftp = { version = "12.2.1", default-features = false }
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2"] }  # no "rsa": RUSTSEC-2023-0071 (Marvin), unfixed; Ed25519/ECDSA keys work
russh-sftp = "3.0.1"
serde_json_path = "0.7.2"
roxmltree = "0.21.2"
fancy-regex = "0.20.0"
base64 = "0.23.1"
url = "2.5.8"
percent-encoding = "2.3.2"
zip = { version = "=9.4.1", default-features = false, features = ["deflate"] }

# tooling
cargo_metadata = "0.23.1"
toml = "1.2.1"
tempfile = "3.27.0"

[patch.crates-io]
# blocking 1.7.0 never retires its last idle thread (2 wakeups/s forever; risk R6). One-line fix.
blocking = { path = "vendor/blocking" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# panic stays "unwind" (ADR 020)

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
