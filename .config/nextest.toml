[profile.default]
# A hung test (a route waiting on a fake overlay, a timer loop) fails after 2 minutes instead of
# holding the run.
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
# CI reports every failing test instead of stopping at the first one.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
# Print only failing and slow tests while running, and list the failures again at the end.
status-level = "slow"
final-status-level = "fail"

# A JUnit report CI keeps as an artifact, so a failure can be read without the raw log.
[profile.ci.junit]
path = "junit.xml"
